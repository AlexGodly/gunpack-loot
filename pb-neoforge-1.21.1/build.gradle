plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}+neoforge-${minecraft_version}"
group = 'com.alexgodly'

base {
    archivesName = 'point-blank-loot'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    mods {
        point_blank_loot {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java.srcDir '../pb-common'
        java.srcDir '../pb-v121'
        resources.srcDir 'build/generated-data'
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}

tasks.register('lootData', Exec) {
    commandLine 'python3', '../tools/pb_data.py', '../data-src/pb-raw', 'build/generated-data', '../pb-assets/point_blank_loot_icon.png'
}

processResources {
    dependsOn 'lootData'
    inputs.property 'version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
