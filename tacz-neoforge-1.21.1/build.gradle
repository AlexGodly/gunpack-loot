plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}+neoforge-${minecraft_version}"
group = 'com.alexgodly'

base {
    archivesName = 'tacz-loot'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    mods {
        tacz_loot {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources.srcDir 'build/generated-data'
    }
}

tasks.register('lootData', Exec) {
    commandLine 'python3', '../tools/tacz_data.py', '../data-src/tacz-1.21.1', 'new', 'build/generated-data'
}

processResources {
    dependsOn 'lootData'
    inputs.property 'version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
