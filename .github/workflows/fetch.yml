name: fetch

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Point Blank Loot and Point Blank info
        shell: bash {0}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, zipfile, io
          UA = {"User-Agent": "AlexGodly/gunpack-loot"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA)).read()
          vs = json.loads(get("https://api.modrinth.com/v2/project/point-blank-loot/version"))
          dp = next(v for v in vs if "datapack" in v["loaders"])
          z = zipfile.ZipFile(io.BytesIO(get(dp["files"][0]["url"])))
          z.extractall("data-src/pb-raw")
          pb = json.loads(get("https://api.modrinth.com/v2/project/vics-point-blank/version"))
          info = [{"v": v["version_number"], "gv": v["game_versions"], "loaders": v["loaders"],
                   "file": v["files"][0]["url"]} for v in pb]
          os.makedirs("data-src", exist_ok=True)
          json.dump(info, open("data-src/pointblank-versions.json", "w"), indent=1)
          # One Point Blank jar per loader/version for reading its classes
          os.makedirs("/tmp/pb", exist_ok=True)
          seen = set()
          for v in info:
              for l in v["loaders"]:
                  key = (l, v["gv"][-1])
                  if key in seen: continue
                  seen.add(key)
                  open(f"/tmp/pb/{l}-{v['gv'][-1]}.jar", "wb").write(get(v["file"]))
          PY
          for j in /tmp/pb/*.jar; do echo "== $j"; unzip -l "$j" | grep -iE "item/GunItem|item/AmmoItem|item/AttachmentItem|ItemRegistry|api/" | head -20 || true; done > data-src/pointblank-classes.txt
          for j in /tmp/pb/*.jar; do mkdir -p /tmp/x && cd /tmp/x && rm -rf * && unzip -q -o "$j" 'mod/pointblank/item/GunItem.class' 'mod/pointblank/registry/ItemRegistry.class' 2>/dev/null || true; cd - >/dev/null; echo "== $j" >> data-src/pointblank-javap.txt; javap -p -cp /tmp/x mod.pointblank.item.GunItem 2>/dev/null | head -60 >> data-src/pointblank-javap.txt; javap -p -cp /tmp/x mod.pointblank.registry.ItemRegistry 2>/dev/null | grep -iE "static|public" | head -40 >> data-src/pointblank-javap.txt || true; done
          git config user.name "Alex Godly"
          git config user.email "AlexGodly@users.noreply.github.com"
          git add data-src
          git commit -qm "Point Blank Loot data and Point Blank info" && git push
